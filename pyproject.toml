[project]
name = "grok-mcp"
version = "0.1.0"
description = "Servidor MCP para a API xAI (Grok): code, chat, imagem, vídeo e voz"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "xai-sdk>=1.21",
  "mcp>=2.3,<3",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.scripts]
grok-mcp = "grok_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grok_mcp"]
